name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install
        env:
          # Force chrome-headless-shell download in CI so integration tests
          # actually exercise the render path. Cached between runs via
          # ~/.cache/poster-browsers (GitHub's default cache works for it).
          POSTER_INSTALL_BROWSER: "1"
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Build
        run: bun run build
      - name: Test
        run: bun test
