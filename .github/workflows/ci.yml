name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps (skip chrome download in CI)
        run: bun install
        env:
          POSTER_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Run tests
        run: bun test
