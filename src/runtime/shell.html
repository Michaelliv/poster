<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />

    <!-- Open Graph + Twitter (title/description only) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{TITLE}}" />

    />

      html, body { margin: 0; padding: 0; background: #fafafa; font-family: Inter, system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div id="poster-root"></div>
    <script>window.__POSTER_META__ = {{META_JSON}};</script>
    <script>{{BUNDLE_JS}}</script>
