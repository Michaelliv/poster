<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    {{OG_IMAGE_TAGS}}

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{TITLE}}" />
    <meta name="twitter:description" content="{{DESCRIPTION}}" />
    {{TWITTER_IMAGE_TAG}}

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html, body { margin: 0; padding: 0; background: #fafafa; font-family: Inter, system-ui, sans-serif; }
      #poster-root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="poster-root"></div>
    <script>window.__POSTER_META__ = {{META_JSON}};</script>
    <script>{{BUNDLE_JS}}</script>
  </body>
</html>
